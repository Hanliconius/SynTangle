[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "syntangle"
version = "0.0.1"
description = "Constrained untangling of multispecies chromosome synteny layouts"
requires-python = ">=3.11"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "SynTangle contributors"}]

[project.optional-dependencies]
optimization = ["numpy==2.3.5", "scipy==1.17.0", "highspy==1.15.1"]
test = ["numpy==2.3.5", "scipy==1.17.0", "highspy==1.15.1", "cvxpy", "matplotlib", "pypdf"]

[project.urls]
Repository = "https://github.com/Hanliconius/SynTangle"
Issues = "https://github.com/Hanliconius/SynTangle/issues"

[project.scripts]
syntangle = "syntangle.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
