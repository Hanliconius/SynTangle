name: Installed package smoke
on: [push, pull_request]
jobs:
  wheel:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install build
      - run: python -m build
      - run: python -m pip install dist/*.whl
      - name: Exercise installed CLI outside checkout
        run: |
          cd "$RUNNER_TEMP"
          syntangle --help
          syntangle refine-genespace --help
          syntangle analyze-fixture "$GITHUB_WORKSPACE/examples/fixtures/layout_noise_only.json"
      - run: python -m unittest discover -s tests -p 'test_genespace_refinement.py'
