name: Installed package smoke
on: [push, pull_request]
jobs:
  wheel:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install build
      - run: python -m build
      - name: Install wheel with optional engines
        run: |
          wheel=$(find dist -name '*.whl' -print -quit)
          python -m pip install "${wheel}[optimization,plotting]"
      - name: Exercise installed CLI outside checkout
        run: |
          cd "$RUNNER_TEMP"
          syntangle --version
          syntangle flip-assist --chromosomes "$GITHUB_WORKSPACE/examples/quickstart/chromosomes.tsv" --links "$GITHUB_WORKSPACE/examples/quickstart/links.tsv" --output flips --figure
          syntangle run --chromosomes "$GITHUB_WORKSPACE/examples/quickstart/chromosomes.tsv" --links "$GITHUB_WORKSPACE/examples/quickstart/links.tsv" --output full --seconds 10 --ribbon-objective crossing-cap --ribbon-seconds 5 --figure
          python - <<'PY'
          import json
          for name, score in [('flips', 8), ('full', 0)]:
              s = json.load(open(name + '/stats.json'))
              assert s['input']['crossings'] == 10
              assert s['output']['crossings'] == score
              assert s['input']['link_count'] == s['output']['link_count'] == 8
              assert s['independent_certificate'] is False
          PY
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
      - run: R CMD INSTALL r/SynTangleR
      - name: R package hand-off to installed Python
        run: SYNTANGLE_TEST_R_INSTALLED=1 SYNTANGLE_TEST_EXECUTABLE="$(command -v syntangle)" Rscript integrations/genespace/test_adapter.R
