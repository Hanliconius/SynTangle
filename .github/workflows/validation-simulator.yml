name: Validation simulator

on:
  push:
    paths:
      - "validation/simulator/**"
      - "src/**"
      - "pyproject.toml"
      - ".github/workflows/validation-simulator.yml"
  pull_request:
    paths:
      - "validation/simulator/**"
      - "src/**"
      - "pyproject.toml"
      - ".github/workflows/validation-simulator.yml"

jobs:
  simulator-smoke:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install SynTangle
        run: python -m pip install -e .

      - name: Run simulator smoke test
        run: Rscript validation/simulator/smoke_test.R

      - name: Generate hidden-truth integration case
        run: Rscript validation/simulator/generate_integration_case.R /tmp/syntangle-generated-case

      - name: Solve generated case without hidden truth
        run: python validation/simulator/check_integration_case.py /tmp/syntangle-generated-case
