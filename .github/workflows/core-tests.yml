name: Core fixture tests

on:
  push:
    paths:
      - "src/**"
      - "tests/**"
      - "validation/real_data/**"
      - "validation/benchmark/genespace_native_order.R"
      - "examples/fixtures/**"
      - "pyproject.toml"
      - ".github/workflows/core-tests.yml"
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "validation/real_data/**"
      - "validation/benchmark/genespace_native_order.R"
      - "examples/fixtures/**"
      - "pyproject.toml"
      - ".github/workflows/core-tests.yml"

jobs:
  fixture-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package
        run: python -m pip install -e ".[test]"
      - name: Run fixture tests
        run: python -m unittest discover -s tests -v
      - name: Run adapter and endpoint preservation tests
        env:
          PYTHONPATH: src:validation/real_data:validation/benchmark
          MPLBACKEND: Agg
        run: python -m unittest validation/real_data/test_missing_native.py validation/real_data/test_preservation_audit.py validation/real_data/test_simple_reconstruction.py
