name: Simulation benchmark smoke

on:
  push:
    paths:
      - "src/**"
      - "validation/simulator/**"
      - "validation/benchmark/**"
      - "pyproject.toml"
      - ".github/workflows/benchmark-smoke.yml"
  pull_request:
    paths:
      - "src/**"
      - "validation/simulator/**"
      - "validation/benchmark/**"
      - "pyproject.toml"
      - ".github/workflows/benchmark-smoke.yml"

jobs:
  benchmark-smoke:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install SynTangle
        run: python -m pip install -e .

      - name: Generate deterministic smoke benchmark
        run: >
          Rscript validation/benchmark/generate_benchmark_cases.R
          /tmp/syntangle-benchmark smoke

      - name: Run benchmark
        run: >
          python validation/benchmark/run_benchmark.py
          /tmp/syntangle-benchmark
          --output /tmp/syntangle-benchmark/benchmark_results.tsv
          --summary-json /tmp/syntangle-benchmark/benchmark_summary.json
          --summary-md /tmp/syntangle-benchmark/benchmark_summary.md
          --transition-cap 250000
          --branch-node-cap 100000
          --local-restarts 4

      - name: Verify benchmark resume path
        run: >
          python validation/benchmark/run_benchmark.py
          /tmp/syntangle-benchmark
          --output /tmp/syntangle-benchmark/benchmark_results.tsv
          --summary-json /tmp/syntangle-benchmark/benchmark_summary.json
          --summary-md /tmp/syntangle-benchmark/benchmark_summary.md
          --transition-cap 250000
          --branch-node-cap 100000
          --local-restarts 4
          --resume

      - name: Generate visual validation report
        run: >
          python validation/benchmark/generate_case_report.py
          /tmp/syntangle-benchmark/smoke_4sp_5chr_random
          /tmp/syntangle-benchmark/smoke_4sp_5chr_random_report.html
          --transition-cap 250000
          --branch-node-cap 100000
          --local-restarts 4
          --seed 1303

      - name: Render benchmark overview
        run: >
          python validation/benchmark/render_benchmark_report.py
          /tmp/syntangle-benchmark/benchmark_results.tsv
          /tmp/syntangle-benchmark/benchmark_report.html
          --title "SynTangle smoke benchmark"
          --svg-dir /tmp/syntangle-benchmark/figures

      - name: Generate paired presentation smoke benchmark
        run: >
          Rscript validation/benchmark/generate_benchmark_cases.R
          /tmp/syntangle-paired paired-smoke

      - name: Run paired presentation smoke benchmark
        run: >
          python validation/benchmark/run_benchmark.py
          /tmp/syntangle-paired
          --output /tmp/syntangle-paired/benchmark_results.tsv
          --summary-json /tmp/syntangle-paired/benchmark_summary.json
          --summary-md /tmp/syntangle-paired/benchmark_summary.md
          --transition-cap 250000
          --branch-node-cap 100000
          --local-restarts 4

      - name: Require paired presentation invariance
        run: >
          python validation/benchmark/check_paired_invariance.py
          /tmp/syntangle-paired/benchmark_results.tsv
          --require-proven
          --json /tmp/syntangle-paired/paired_invariance.json
          --markdown /tmp/syntangle-paired/paired_invariance.md

      - name: Render paired visual report
        run: >
          python validation/benchmark/render_benchmark_report.py
          /tmp/syntangle-paired/benchmark_results.tsv
          /tmp/syntangle-paired/benchmark_report.html
          --title "SynTangle paired presentation smoke benchmark"
          --svg-dir /tmp/syntangle-paired/figures

      - name: Generate high-complexity stress fixtures
        run: >
          Rscript validation/benchmark/generate_benchmark_cases.R
          /tmp/syntangle-stress stress

      - name: Generate orthogonal biological benchmark fixtures
        run: >
          Rscript validation/benchmark/generate_benchmark_cases.R
          /tmp/syntangle-factorial factorial

      - name: Verify orthogonal benchmark manifest
        run: >
          python -c "import csv, pathlib;
          p=pathlib.Path('/tmp/syntangle-factorial/benchmark_manifest.tsv');
          rows=list(csv.DictReader(p.open(), delimiter='\t'));
          assert len(rows)==15;
          assert all(r['lineage_model']=='independent' for r in rows);
          assert {int(r['ancestor_chromosomes']) for r in rows} >= {8,16,31,40};
          assert {int(r['species_count']) for r in rows} >= {4,8,12,20};
          assert {int(r['events_per_branch']) for r in rows} >= {0,1,2,5}"

      - name: Solve one orthogonal biological case
        run: >
          python validation/benchmark/generate_case_report.py
          /tmp/syntangle-factorial/factor_species_4sp_16chr_1ev
          /tmp/syntangle-factorial/factor_species_4sp_16chr_1ev_report.html
          --transition-cap 100000
          --branch-node-cap 5000
          --local-restarts 1
          --component-workers 2
          --seed 9101

      - name: Solve Stage 19 slow conserved-karyotype regression
        run: |
          python - <<'PY'
          from pathlib import Path
          from time import perf_counter
          from syntangle import load_validation_bundle, optimize_auto

          case = Path("/tmp/syntangle-factorial/factor_lep_12sp_31chr_0ev")
          fixture = load_validation_bundle(case)
          started = perf_counter()
          result = optimize_auto(
              fixture,
              transition_cap_per_component=100000,
              branch_node_cap_per_component=25000,
              local_restarts=2,
              component_workers=4,
              seed=9401,
          )
          elapsed = perf_counter() - started
          print(
              "STAGE20_REGRESSION",
              result.solver,
              result.layout.optimized_score.crossings,
              result.layout.optimality_status,
              f"{elapsed:.6f}s",
          )
          assert result.solver == "exact-residual-factor-elimination"
          assert result.layout.optimized_score.crossings == 0
          assert result.layout.optimality_status == "proven optimum"
          PY

      - name: Upload smoke benchmark outputs
        uses: actions/upload-artifact@v4
        with:
          name: syntangle-simulation-benchmark-smoke
          path: |
            /tmp/syntangle-benchmark/benchmark_results.tsv
            /tmp/syntangle-benchmark/benchmark_summary.json
            /tmp/syntangle-benchmark/benchmark_summary.md
            /tmp/syntangle-benchmark/smoke_4sp_5chr_random_report.html
            /tmp/syntangle-benchmark/benchmark_report.html
            /tmp/syntangle-benchmark/figures/
            /tmp/syntangle-paired/benchmark_results.tsv
            /tmp/syntangle-paired/benchmark_summary.json
            /tmp/syntangle-paired/benchmark_summary.md
            /tmp/syntangle-paired/paired_invariance.json
            /tmp/syntangle-paired/paired_invariance.md
            /tmp/syntangle-paired/benchmark_report.html
            /tmp/syntangle-paired/figures/
            /tmp/syntangle-stress/benchmark_manifest.tsv
            /tmp/syntangle-factorial/benchmark_manifest.tsv
            /tmp/syntangle-factorial/factor_species_4sp_16chr_1ev_report.html
